<!doctype html>
<!--
  イントロ用タイトルカード（1920x1080）。
  シーンスクリプト（video/scenes/01-intro.mjs）が録画中のページで file:// で開き、
  冒頭ナレーションの背景として表示する。デザインは thumbnail.html と統一する。
  外部リソースは使用しない。バージョン表記は ?version=x.y.z で差し込む。
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>TiAb Review Plugin 操作解説</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI",
      "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.10), transparent 45%),
      linear-gradient(135deg, #0b3d91 0%, #145ea8 45%, #1c8fc4 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .stage::after {
    content: "";
    position: absolute;
    right: -160px;
    bottom: -200px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
  }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 84px;
    height: 84px;
    border-radius: 20px;
    background: #ffffff;
    color: #145ea8;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .brand-name {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .headline {
    font-size: 150px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 4px;
    text-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }
  .subtext {
    margin-top: 36px;
    font-size: 44px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.92);
  }
  .footer-row {
    position: absolute;
    left: 120px;
    right: 120px;
    bottom: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-tag {
    font-size: 30px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.12);
    padding: 14px 28px;
    border-radius: 999px;
  }
  .footer-version {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand-row">
      <span class="brand-badge">Ti</span>
      <span class="brand-name">TiAb Review Plugin</span>
    </div>
    <div class="headline">操作解説</div>
    <div class="subtext">システマティックレビューの文献スクリーニングを効率化するChrome拡張機能</div>
    <div class="footer-row">
      <span class="footer-tag">SRWS-PSG</span>
      <span class="footer-version" id="version-tag">v0.0.0</span>
    </div>
  </div>
  <script>
    // ?version=x.y.z をバージョン表記に反映する（無ければ既定表示のまま）
    const params = new URLSearchParams(location.search);
    const version = params.get('version');
    if (version) {
      document.getElementById('version-tag').textContent = 'v' + version;
    }
  </script>
</body>
</html>
