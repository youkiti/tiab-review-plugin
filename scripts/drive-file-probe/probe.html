<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive File Probe</title>
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px; font-family: system-ui, sans-serif; }
    .card { border: 1px solid #dadce0; border-radius: 12px; padding: 24px; background: #fff; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; background: #1a73e8; color: #fff; cursor: pointer; font-weight: 600; }
    button:disabled { background: #9aa0a6; cursor: not-allowed; }
    #status { margin-top: 16px; white-space: pre-wrap; color: #202124; }
    #result { margin-top: 16px; padding: 12px; background: #f1f3f4; border-radius: 8px; max-height: 320px; overflow: auto; font-size: 12px; }
    .hint { color: #5f6368; line-height: 1.6; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
  <main class="card">
    <h1>Drive File Probe</h1>
    <p class="hint">
      drive.file スコープの付与挙動を実機で測定するための計測用ページです。
      通常は scripts/drive-file-probe/run.mjs（Playwright ランナー）から自動操作されます。
      手動で開いた場合も、下のボタンでサインインと Picker 操作を試せます。
    </p>
    <div class="actions">
      <button id="signin" type="button">サインイン</button>
      <button id="open-picker" type="button" disabled>Picker を開く</button>
    </div>
    <div id="status" role="status">初期化しています...</div>
    <pre id="result"></pre>
  </main>
  <script type="module" src="probe.js"></script>
</body>
</html>
