# 品質検査と各productionビルドを独立して並列実行し、結果を早く得る。
# 型・Lint・テストに加え、依存方向・循環・巨大ファイル・初期JS量の回帰を検出する。
# npm ciを含む直列との差はCI実測で確認する。検証用成果物は配布しない。
name: build-check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:structure

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          WEBAUTH_CLIENT_ID: placeholder

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          WEB_OAUTH_CLIENT_ID: placeholder
          PICKER_API_KEY: placeholder
          GCP_PROJECT_NUMBER: '000000000000'

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # bench:bundle がプレースホルダーで隔離ビルドし、統計を予算と比較する。
      - run: npm run check:bundle
