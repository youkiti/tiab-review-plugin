name: build-check

# PR ごとに拡張ビルドと Web ビルドの両方を実行し、どちらかが壊れたらマージ不可にする。
# これにより「表示系の新機能はリリース時に自動で Web 版へ載る」状態を機械的に保証する（NFR-5）。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node のバージョンは .nvmrc を単一の源にする（package.json の engines と揃える。Issue #162）
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # dev ビルドも OAuth クライアントID未設定なら既定で fail-fast する（本番同様）。
      # CI には .env が無く、認証を触らないビルド疎通確認が目的のため、
      # ALLOW_NO_AUTH=1 を明示指定して警告のみで通す（本番ビルドの throw は無効化されない）。
      - run: npm run dev        # 拡張ビルド
        env:
          ALLOW_NO_AUTH: 1
      - run: npm run dev:web    # Web ビルド
        env:
          ALLOW_NO_AUTH: 1
