<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiAb Review - Screening</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <div id="header-title" class="header-title" style="cursor: pointer;" data-i18n-title="nav_backToProject">
                <h1>TiAb Review</h1>
                <span class="build-version">Build: 2026-05-08</span>
            </div>
            <div class="header-tabs hidden">
                <button id="tab-screening" class="tab-btn active" data-i18n-title="nav_tabManualTitle" data-i18n="nav_tabManual"></button>
                <button id="tab-ml" class="tab-btn" data-i18n-title="nav_tabMlTitle" data-i18n="nav_tabMl"></button>
                <button id="tab-llm" class="tab-btn" data-i18n-title="nav_tabAiTitle" data-i18n="nav_tabAi"></button>
            </div>
            <div class="progress">
                <span id="progress-text">0 / 0</span>
            </div>
        </header>


        <!-- 設定セクション -->
        <section id="config-section" class="section">
            <h2 data-i18n="project_settings"></h2>

            <!-- ログインセクション（未ログイン時のみ表示） -->
            <div id="login-section" class="login-section">
                <div class="login-header">
                    <a href="https://youkiti.github.io/tiab-review-plugin/help.html" target="_blank"
                        class="btn btn-icon" data-i18n-title="common_help">❓</a>
                </div>
                <button id="login-btn" class="btn btn-primary btn-large" data-i18n="auth_loginWithGoogle">
                </button>
            </div>

            <!-- プロジェクト選択セクション（ログイン後に表示） -->
            <div id="project-section" class="project-section hidden">
                <div class="user-info-container">
                    <div id="user-info" class="user-info"></div>
                    <div class="user-info-buttons">
                        <button id="settings-btn-project" class="btn btn-icon" data-i18n-title="common_settings">⚙️</button>
                        <a href="https://youkiti.github.io/tiab-review-plugin/help.html" target="_blank"
                            class="btn btn-icon" data-i18n-title="common_help">❓</a>
                        <button id="logout-btn" class="btn btn-outline btn-xsmall" data-i18n="auth_logout"></button>
                    </div>
                </div>

                <!-- 新規プロジェクト作成 -->
                <div class="setup-option primary">
                    <button id="create-btn" class="btn btn-primary btn-large" data-i18n="project_createNew">
                    </button>
                    <p class="help-text" data-i18n="project_createHelp"></p>
                </div>

                <!-- 既存プロジェクトに接続 -->
                <div class="setup-option secondary">
                    <div class="divider"><span data-i18n="project_orDivider"></span></div>
                    <label data-i18n="project_inputLabel"></label>
                    <input id="spreadsheet-input" class="manual-sheet-input" type="text"
                        data-i18n-placeholder="project_inputPlaceholder">
                    <p class="help-text" data-i18n="project_inputHelp"></p>
                    <label data-i18n="project_recentLabel"></label>
                    <select id="recent-sheets" class="recent-sheets-select">
                        <option value="" data-i18n="project_loading"></option>
                    </select>
                    <button id="connect-btn" class="btn btn-secondary"
                        style="margin-top: 8px; width: 100%;" data-i18n="project_connect"></button>
                </div>
            </div>

            <div id="status-message" class="status-message hidden"></div>
            <div id="loading" class="loading hidden" data-i18n="common_loading"></div>
        </section>

        <!-- スクリーニングセクション -->
        <section id="screening-section" class="section hidden">
            <!-- ツールバー -->
            <div id="import-section" class="import-section">
                <button id="back-btn" class="btn btn-nav btn-small" data-i18n-title="nav_backToProject" data-i18n="screening_back">
                </button>
                <input type="file" id="ris-file" accept=".ris,.nbib,.txt,.csv,.xml,.enl,.enlp" class="hidden">
                <button id="import-btn" class="btn btn-secondary btn-small" data-i18n="screening_importRis" data-i18n-title="screening_importTitle">
                </button>
                <div class="export-container">
                    <button id="export-btn" class="btn btn-secondary btn-small" data-i18n="screening_export">
                    </button>
                    <div id="export-menu" class="export-menu hidden">
                        <button id="export-csv-btn" class="export-menu-item" data-i18n="screening_exportCsv"></button>
                        <button id="export-ris-btn" class="export-menu-item" data-i18n="screening_exportRis"></button>
                    </div>
                </div>
                <div class="share-container">
                    <button id="share-btn" class="btn btn-secondary btn-small" data-i18n="screening_share">
                    </button>
                    <div id="share-input-area" class="share-input-area hidden">
                        <input type="email" id="share-email-input" data-i18n-placeholder="share_emailPlaceholder"
                            class="share-email-input">
                        <button id="share-submit-btn" class="btn btn-primary btn-xsmall" data-i18n="share_add"></button>
                        <button id="share-cancel-btn" class="btn btn-outline btn-xsmall">✕</button>
                        <div class="shared-users-section">
                            <h5 data-i18n="share_sharedUsers"></h5>
                            <div id="shared-users-list" class="shared-users-list"></div>
                        </div>
                    </div>
                </div>
                <div id="key-section" class="toggle-container hidden">
                    <label class="switch">
                        <input type="checkbox" id="key-toggle-input">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label">Blind on/off</span>
                </div>
                <div id="ai-highlight-container" class="ai-highlight-container hidden">
                    <label class="reviewer-label" style="font-weight: bold;">
                        <input type="checkbox" id="ai-highlight-checkbox">
                        <span data-i18n="filter_aiHighlight"></span>
                    </label>
                </div>
                <div id="reviewer-filter-container" class="reviewer-filter-container hidden">
                    <h5>Reviewers</h5>
                    <div class="reviewer-list"></div>
                </div>
                <button id="settings-btn-screening" class="btn btn-icon" data-i18n-title="common_settings">⚙️</button>
                <a href="https://youkiti.github.io/tiab-review-plugin/help.html" target="_blank"
                    class="btn btn-icon btn-help" data-i18n-title="common_help">❓</a>
                <span id="import-status" class="import-status"></span>
            </div>

            <!-- フィルター -->
            <div class="filters">
                <select id="status-filter">
                    <option value="pending" data-i18n="filter_pending"></option>
                    <option value="all" data-i18n="filter_all"></option>
                    <option value="include" data-i18n="filter_include"></option>
                    <option value="exclude" data-i18n="filter_exclude"></option>
                    <option value="maybe" data-i18n="filter_maybe"></option>
                    <option value="conflict" data-i18n="filter_conflict"></option>
                    <option value="fulltext_candidates" data-i18n="filter_fulltextCandidates"></option>
                </select>
                <div class="search-container">
                    <div id="active-term-filters" class="active-term-filters"></div>
                    <input type="search" id="search-input" data-i18n-placeholder="screening_searchPlaceholder">
                    <span id="search-result-count" class="search-result-count hidden"></span>
                </div>
                <span id="filter-result-count" class="filter-result-count"></span>
            </div>

            <!-- 文献詳細 -->
            <article id="reference-detail" class="reference-card">
                <!-- 不一致警告バナー（キーオープン後のみ表示） -->
                <div id="conflict-banner" class="conflict-banner hidden" data-i18n="screening_conflictBanner">
                </div>

                <!-- 全レビュアーの判定一覧（キーオープン後のみ表示） -->
                <div id="all-decisions" class="all-decisions hidden"></div>

                <!-- レコード件数表示（タイトル上：設定でOFFの場合） -->
                <div id="record-count-above" class="record-count-display hidden"></div>

                <div id="ref-decision-status-row" class="reference-status-row hidden">
                    <span class="reference-status-label" data-i18n="screening_currentDecision"></span>
                    <span id="ref-decision-chip" class="reference-status-chip pending"></span>
                </div>

                <h3 id="ref-title" class="ref-title" data-i18n="screening_title"></h3>
                <div class="ref-meta">
                    <span id="ref-authors"></span>
                    <span id="ref-year"></span>
                    <span id="ref-journal"></span>
                </div>
                <div class="ref-meta-badges">
                    <span id="ref-source-badge" class="ref-source-badge hidden"></span>
                </div>

                <div id="ref-trial-registry-note" class="ref-trial-registry-note hidden" data-i18n="screening_trialRegistryNote"></div>
                <div id="ref-abstract" class="ref-abstract" data-i18n="screening_abstractPlaceholder"></div>
                <div class="ref-links">
                    <a id="ref-doi" href="#" target="_blank" class="hidden">DOI</a>
                    <a id="ref-pmid" href="#" target="_blank" class="hidden">PubMed</a>
                </div>
            </article>

            <!-- 判定ボタン -->
            <div class="decision-buttons">
                <button id="btn-include" class="btn btn-include" title="Include (i)">
                    ✓ Include (i)
                </button>
                <button id="btn-maybe" class="btn btn-maybe" title="Maybe (m)">
                    ? Maybe (m)
                </button>
                <button id="btn-exclude" class="btn btn-exclude" title="Exclude (e)">
                    ✕ Exclude (e)
                </button>
            </div>

            <!-- ナビゲーション -->
            <div class="navigation">
                <button id="btn-prev" class="btn btn-nav" data-i18n="nav_prev"></button>
                <div class="nav-center">
                    <span id="nav-position">1 / 100</span>
                    <div id="nav-progress" class="nav-progress hidden"></div>
                </div>
                <button id="btn-next" class="btn btn-nav" data-i18n="nav_next"></button>
            </div>

            <!-- ハイライト設定 -->
            <div id="config-settings" class="config-settings">
                <div class="config-header">
                    <h4 data-i18n="keyword_highlightSettings"></h4>
                    <div class="preset-buttons">
                        <button id="preset-rct-btn" class="btn btn-xsmall btn-outline"
                            data-i18n-title="keyword_presetRctTitle">RCT</button>
                        <button id="preset-sr-btn" class="btn btn-xsmall btn-outline"
                            data-i18n-title="keyword_presetSrTitle">SR</button>
                    </div>
                </div>

                <!-- 組み入れキーワード -->
                <div class="keyword-group include-group">
                    <h5 data-i18n="keyword_includeGroup"></h5>
                    <div id="include-keywords-list" class="keyword-list"></div>
                    <div class="keyword-input-group">
                        <input type="text" id="new-include-input" data-i18n-placeholder="keyword_addIncludePlaceholder">
                        <button id="add-include-btn" class="btn btn-small btn-secondary">＋</button>
                    </div>
                </div>

                <!-- 除外キーワード -->
                <div class="keyword-group exclude-group">
                    <h5 data-i18n="keyword_excludeGroup"></h5>
                    <div id="exclude-keywords-list" class="keyword-list"></div>
                    <div class="keyword-input-group">
                        <input type="text" id="new-exclude-input" data-i18n-placeholder="keyword_addExcludePlaceholder">
                        <button id="add-exclude-btn" class="btn btn-small btn-secondary">＋</button>
                    </div>
                </div>

                <!-- 自動保存ステータス -->
                <div id="save-status" class="save-status">
                    <span class="save-icon">✓</span> <span data-i18n="keyword_autoSave"></span>
                </div>
            </div>

            <!-- メモ -->
            <div class="form-group">
                <label for="note" data-i18n="screening_noteLabel"></label>
                <textarea id="note" rows="2" data-i18n-placeholder="screening_notePlaceholder"></textarea>
            </div>

            <!-- 担当セットフィルター (管理者のみ) -->
            <div id="assignment-filters-section" class="source-filters-section hidden">
                <h4 data-i18n="assignment_filterTitle"></h4>
                <div id="assignment-set-list" class="source-file-list"></div>
            </div>

            <!-- インポート元フィルター (最下部) -->
            <div id="source-filters-section" class="source-filters-section">
                <h4 data-i18n="filter_sourceFiles"></h4>
                <div id="source-file-list" class="source-file-list"></div>
            </div>
        </section>

        <!-- 設定画面セクション -->
        <section id="settings-section" class="section hidden">
            <div class="settings-header">
                <h2 data-i18n="settings_title"></h2>
                <button id="close-settings-btn" class="btn btn-outline btn-small" data-i18n="settings_close"></button>
            </div>

            <div class="settings-content">
                <div class="setting-item">
                    <label class="setting-label">
                        <input type="checkbox" id="auto-navigate-checkbox" checked>
                        <span data-i18n="settings_autoNavigate"></span>
                    </label>
                    <p class="setting-description" data-i18n="settings_autoNavigateDesc">
                    </p>
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        <input type="checkbox" id="show-record-count-checkbox" checked>
                        <span data-i18n="settings_showRecordCount"></span>
                    </label>
                    <p class="setting-description" data-i18n="settings_showRecordCountDesc">
                    </p>
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        <input type="checkbox" id="term-filter-and-checkbox" checked>
                        <span data-i18n="settings_termFilterAnd"></span>
                    </label>
                    <p class="setting-description" data-i18n="settings_termFilterAndDesc">
                    </p>
                </div>

                <div class="setting-item">
                    <label class="setting-label">
                        <input type="checkbox" id="treat-ml-as-manual-checkbox" checked>
                        <span data-i18n="settings_treatMlAsManual"></span>
                    </label>
                    <p class="setting-description" data-i18n="settings_treatMlAsManualDesc">
                    </p>
                </div>
                            <div id="assignment-settings-item" class="setting-item hidden">
                    <div class="setting-header-row">
                        <div>
                            <div class="setting-title" data-i18n="assignment_settingsTitle"></div>
                            <p id="assignment-settings-status" class="setting-description"></p>
                        </div>
                        <button id="assignment-reset-btn" class="btn btn-secondary btn-small hidden"></button>
                    </div>
                    <div id="assignment-reviewer-map" class="assignment-reviewer-map hidden"></div>
                    <button id="assignment-save-btn" class="btn btn-primary btn-small hidden" data-i18n="assignment_settingsSaveMap"></button>
                </div>
            </div>
        </section>

        <!-- LLM処理セクション -->
        <section id="llm-section" class="section hidden">
            <!-- ツールバー -->
            <div class="llm-toolbar">
                <button id="llm-back-btn" class="btn btn-nav btn-small" data-i18n-title="nav_backToProject" data-i18n="screening_back">
                </button>
                <span class="llm-title" data-i18n="llm_title"></span>
                <button id="llm-settings-btn" class="btn btn-icon" data-i18n-title="common_settings">⚙️</button>
            </div>

            <!-- 詳細設定 -->
            <div class="llm-card collapsible">
                <h4 class="collapsible-header">
                    <span data-i18n="llm_detailSettings"></span>
                    <span class="collapse-icon">▼</span>
                </h4>
                <div class="collapsible-content">
                    <div class="setting-row">
                        <label data-i18n="llm_modelLabel"></label>
                        <span class="help-icon" data-i18n-tooltip="llm_tip_model" tabindex="0">?</span>
                        <select id="llm-model-select">
                            <option value="gemini-3-flash-preview" selected data-i18n="llm_modelFlash3"></option>
                            <option value="gemini-2.5-flash-lite" data-i18n="llm_modelLite"></option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label data-i18n="llm_outputLanguage"></label>
                        <span class="help-icon" data-i18n-tooltip="llm_tip_outputLanguage" tabindex="0">?</span>
                        <select id="llm-language-select">
                            <option value="ja" data-i18n="llm_langJa"></option>
                            <option value="en" data-i18n="llm_langEn"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- APIキー設定 -->
            <div id="api-key-card" class="llm-card collapsible">
                <h4 class="collapsible-header">
                    <span data-i18n="llm_apiKeyTitle"></span>
                    <span class="help-icon" data-i18n-tooltip="llm_tip_apiKey" tabindex="0">?</span>
                    <span id="api-key-summary" class="card-summary"></span>
                    <span class="collapse-icon">▼</span>
                </h4>
                <div class="collapsible-content">
                    <div class="api-key-input-group">
                        <input type="password" id="gemini-api-key" data-i18n-placeholder="llm_apiKeyPlaceholder" class="api-key-input">
                        <button id="toggle-api-key-visibility" class="btn btn-icon" data-i18n-title="common_showHide">👁</button>
                    </div>
                    <div class="api-key-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="save-api-key-checkbox" checked>
                            <span data-i18n="llm_apiKeySaveToDevice"></span>
                            <span class="help-icon" data-i18n-tooltip="llm_tip_apiKeySave" tabindex="0">?</span>
                        </label>
                    </div>
                    <div id="api-key-status" class="api-key-status"></div>
                </div>
            </div>

            <!-- レビュー基準 -->
            <div id="criteria-card" class="llm-card">
                <h4 data-i18n="llm_criteriaTitle"></h4>

                <div class="criteria-section">
                    <label data-i18n="llm_protocolInputLabel"></label>
                    <span class="help-icon" data-i18n-tooltip="llm_tip_protocol" tabindex="0">?</span>
                    <textarea id="protocol-text-input" rows="6"
                        data-i18n-placeholder="llm_protocolPlaceholder"></textarea>
                </div>

                <button id="optimize-criteria-btn" class="btn btn-primary btn-full" data-i18n="llm_optimizeBtn">
                </button>
                <div id="optimize-status" class="optimize-status hidden"></div>

                <div class="criteria-section">
                    <label data-i18n="llm_optimizedLabel"></label>
                    <div id="optimized-criteria-display" class="optimized-criteria-display">
                        <p class="placeholder-text" data-i18n="llm_optimizedPlaceholder"></p>
                    </div>
                    <textarea id="screening-prompt-input" rows="4" data-i18n-placeholder="llm_screeningPromptPlaceholder"
                        class="hidden"></textarea>
                </div>

                <button id="save-criteria-btn" class="btn btn-secondary btn-full hidden" data-i18n="llm_saveCriteria">
                </button>
            </div>

            <!-- 一括実行 -->
            <div class="llm-card">
                <h4 data-i18n="llm_batchTitle"></h4>

                <div class="setting-row">
                    <label data-i18n="llm_batchSizeLabel"></label>
                    <span class="help-icon" data-i18n-tooltip="llm_tip_batchSize" tabindex="0">?</span>
                    <input type="number" id="batch-save-size-input" value="5" min="1" max="50" style="width: 60px;">
                    <span class="setting-hint" data-i18n="llm_batchSizeHint"></span>
                </div>

                <div class="setting-row">
                    <label data-i18n="llm_batchMaxCountLabel"></label>
                    <span class="help-icon" data-i18n-tooltip="llm_tip_maxCount" tabindex="0">?</span>
                    <select id="batch-max-count-select">
                        <option value="10">10</option>
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="500">500</option>
                        <option value="all" data-i18n="llm_batchMaxCountAll"></option>
                    </select>
                </div>

                <div id="batch-info" class="batch-info">
                    <span data-i18n="llm_batchPending"></span> <span id="batch-target-count">0</span>
                    / <span data-i18n="llm_batchPlanned"></span> <span id="batch-planned-count">0</span>
                </div>

                <button id="start-batch-btn" class="btn btn-primary btn-full" data-i18n="llm_batchStart">
                </button>
                <button id="stop-batch-btn" class="btn btn-danger btn-full hidden" data-i18n="llm_batchStop">
                </button>

                <div id="batch-progress" class="batch-progress hidden">
                    <div class="progress-text">
                        <span data-i18n="llm_batchProgress"></span> <span id="batch-progress-current">0</span>/<span id="batch-progress-total">0</span>
                        (<span id="batch-progress-percent">0</span>%)
                    </div>
                    <div class="progress-bar">
                        <div id="batch-progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                    <div class="progress-stats">
                        <span data-i18n="llm_batchSuccess"></span> <span id="batch-success-count">0</span> /
                        <span data-i18n="llm_batchFail"></span> <span id="batch-fail-count">0</span> /
                        <span data-i18n="llm_batchFallback"></span> <span id="batch-fallback-count">0</span>
                    </div>
                </div>

                <button id="retry-failed-btn" class="btn btn-secondary btn-full hidden">
                </button>
            </div>

            <!-- 閾値調整（実行完了後に表示） -->
            <div id="threshold-section" class="llm-card hidden">
                <h4 data-i18n="llm_thresholdTitle"></h4>

                <div id="threshold-complete-message" class="complete-message">
                </div>

                <div class="threshold-control">
                    <label><span data-i18n="llm_thresholdLabel"></span> <span id="threshold-value-display">0.30</span><span class="help-icon" data-i18n-tooltip="llm_tip_threshold" tabindex="0">?</span></label>
                    <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.30">
                    <div class="threshold-range-labels">
                        <span>0.0</span>
                        <span>1.0</span>
                    </div>
                    <p class="threshold-help" data-i18n="llm_thresholdHelp"></p>
                </div>

                <div class="threshold-preview">
                    <div class="preview-item include">
                        Include: <span id="preview-include-count">0</span>
                        (<span id="preview-include-percent">0</span>%)
                    </div>
                    <div class="preview-item exclude">
                        Exclude: <span id="preview-exclude-count">0</span>
                        (<span id="preview-exclude-percent">0</span>%)
                    </div>
                </div>

                <button id="toggle-distribution-btn" class="btn btn-outline btn-small" data-i18n="llm_showDistribution">
                </button>
                <div id="distribution-chart" class="distribution-chart hidden">
                </div>

                <button id="confirm-threshold-btn" class="btn btn-primary btn-full" data-i18n="llm_confirmThreshold">
                </button>
                <p class="threshold-note" data-i18n="llm_thresholdNote"></p>
            </div>

            <!-- LLM実行履歴 -->
            <div class="llm-card collapsible">
                <h4 class="collapsible-header">
                    <span data-i18n="llm_historyTitle"></span>
                    <span class="collapse-icon">▼</span>
                </h4>
                <div class="collapsible-content">
                    <div id="execution-history" class="execution-history">
                        <p class="placeholder-text" data-i18n="llm_historyEmpty"></p>
                    </div>
                </div>
            </div>
        </section>
        <!-- ML処理セクション -->
        <section id="ml-section" class="section hidden">
            <!-- ツールバー -->
            <div class="llm-toolbar">
                <button id="ml-back-btn" class="btn btn-nav btn-small" data-i18n="screening_back"></button>
                <span class="llm-title" data-i18n="ml_title"></span>
                <button id="ml-settings-btn" class="btn btn-icon" data-i18n-title="common_settings">⚙️</button>
                <div class="ml-status-badge" id="ml-status-badge">
                    <span class="status-indicator">●</span> <span id="ml-status-text" data-i18n="ml_statusIdle"></span>
                </div>
            </div>

            <!-- 学習状態・停止基準 (折りたたみ可能) -->
            <div class="llm-card collapsible">
                <h4 class="collapsible-header">
                    <span data-i18n="ml_learningState"></span>
                    <span class="collapse-icon">▼</span>
                </h4>
                <div class="collapsible-content">
                    <div class="ml-stats-row">
                        <div class="ml-stat-item">
                            <span class="label">Include</span>
                            <span class="value include" id="ml-count-include">0</span>
                        </div>
                        <div class="ml-stat-item">
                            <span class="label">Exclude</span>
                            <span class="value exclude" id="ml-count-exclude">0</span>
                        </div>
                        <div class="ml-stat-item">
                            <span class="label">Remaining</span>
                            <span class="value" id="ml-count-remaining">0</span>
                        </div>
                    </div>

                    <div class="stopping-rule-container">
                        <div class="stopping-header">
                            <span class="stopping-label-group">
                                <span class="label" data-i18n="ml_stoppingLabel"></span>
                                <span class="help-icon" data-i18n-tooltip="ml_tip_stopping" tabindex="0">?</span>
                            </span>
                            <button id="ml-stopping-settings-btn" class="btn-link" data-i18n="ml_stoppingNone"></button>
                        </div>
                        <div class="stopping-progress-bar hidden" id="ml-stopping-progress-container">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="ml-stopping-progress-fill" style="width: 0%"></div>
                            </div>
                            <div class="progress-text">
                                <span id="ml-stopping-current">0</span> / <span id="ml-stopping-threshold">50</span>
                                <span data-i18n="ml_stoppingConsecutive"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 検索 -->
            <div class="filters">
                <div class="search-container" style="flex: 1;">
                    <input type="search" id="ml-search-input" data-i18n-placeholder="screening_searchPlaceholder">
                    <span id="ml-search-result-count" class="search-result-count hidden"></span>
                </div>
            </div>

            <!-- 現在の文献情報 -->
            <article id="ml-reference-card" class="reference-card">
                <div id="ml-ref-decision-status-row" class="reference-status-row hidden">
                    <span class="reference-status-label" data-i18n="screening_currentDecision"></span>
                    <span id="ml-ref-decision-chip" class="reference-status-chip pending"></span>
                </div>
                <h3 id="ml-ref-title" class="ref-title" data-i18n="ml_titlePlaceholder"></h3>
                <div class="ref-meta">
                    <span id="ml-ref-authors">Authors...</span>
                    <span id="ml-ref-year">Year</span>
                </div>
                <div id="ml-ref-abstract" class="ref-abstract" data-i18n="ml_abstractPlaceholder">
                </div>
            </article>

            <!-- 判定ボタン -->
            <div class="decision-buttons">
                <button id="ml-btn-include" class="btn btn-include" title="Include (i)">✓ Include (i)</button>
                <button id="ml-btn-exclude" class="btn btn-exclude" title="Exclude (e)">✕ Exclude (e)</button>
            </div>

            <!-- ナビゲーション -->
            <div class="navigation">
                <button id="ml-btn-prev" class="btn btn-nav" data-i18n="ml_back"></button>
                <div class="nav-center">
                    <span id="ml-nav-position">- / -</span>
                </div>
                <button id="ml-btn-next" class="btn btn-nav" data-i18n="ml_forward"></button>
            </div>

            <!-- メモ -->
            <div class="form-group">
                <label for="ml-note" data-i18n="screening_noteLabel"></label>
                <textarea id="ml-note" rows="2" data-i18n-placeholder="screening_notePlaceholder"></textarea>
            </div>

            <!-- ハイライト設定 (下部) -->

            <div id="ml-config-settings" class="config-settings">
                <div class="config-header">
                    <h4 data-i18n="keyword_highlightSettings"></h4>
                </div>

                <!-- 組み入れキーワード -->
                <div class="keyword-group include-group">
                    <h5 data-i18n="keyword_includeGroup"></h5>
                    <div id="ml-include-keywords-list" class="keyword-list"></div>
                    <div class="keyword-input-group">
                        <input type="text" id="ml-new-include-input" data-i18n-placeholder="keyword_addIncludePlaceholder">
                        <button id="ml-add-include-btn" class="btn btn-small btn-secondary">＋</button>
                    </div>
                </div>

                <!-- 除外キーワード -->
                <div class="keyword-group exclude-group">
                    <h5 data-i18n="keyword_excludeGroup"></h5>
                    <div id="ml-exclude-keywords-list" class="keyword-list"></div>
                    <div class="keyword-input-group">
                        <input type="text" id="ml-new-exclude-input" data-i18n-placeholder="keyword_addExcludePlaceholder">
                        <button id="ml-add-exclude-btn" class="btn btn-small btn-secondary">＋</button>
                    </div>
                </div>
            </div>

        </section>
    </div>

    <!-- モーダルダイアログ -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close-btn" class="btn-icon">✕</button>
            </div>
            <div id="modal-body" class="modal-body">
            </div>
            <div id="modal-footer" class="modal-footer">
            </div>
        </div>
    </div>

    <!-- トースト通知（CSSでデフォルト非表示、.showで表示） -->
    <div id="toast" class="toast"></div>

    <script src="sidepanel.js"></script>
</body>

</html>
