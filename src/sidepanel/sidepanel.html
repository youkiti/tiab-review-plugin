<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiAb Review - Screening</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <h1>TiAb Review</h1>
            <div class="progress">
                <span id="progress-text">0 / 0</span>
            </div>
        </header>

        <!-- 設定セクション -->
        <section id="config-section" class="section">
            <h2>プロジェクト設定</h2>
            <div id="user-info" class="user-info"></div>

            <!-- 新規プロジェクト作成（メイン） -->
            <div class="setup-option primary">
                <button id="create-btn" class="btn btn-primary btn-large">
                    ＋ 新規レビュープロジェクトを作成
                </button>
                <p class="help-text">Google Driveに新しいスプレッドシートを作成します</p>
            </div>

            <!-- 既存プロジェクトに接続 -->
            <div class="setup-option secondary">
                <div class="divider"><span>または</span></div>
                <label>最近のスプレッドシートから選択</label>
                <select id="recent-sheets" class="recent-sheets-select">
                    <option value="">読み込み中...</option>
                </select>
                <button id="connect-btn" class="btn btn-secondary"
                    style="margin-top: 8px; width: 100%;">選択したシートに接続</button>
            </div>

            <div id="status-message" class="status-message hidden"></div>
            <div id="loading" class="loading hidden">読み込み中...</div>
        </section>

        <!-- スクリーニングセクション -->
        <section id="screening-section" class="section hidden">
            <!-- RIS インポート -->
            <div id="import-section" class="import-section">
                <input type="file" id="ris-file" accept=".ris,.txt" class="hidden">
                <button id="import-btn" class="btn btn-secondary btn-small">
                    📁 RISファイルをインポート
                </button>
                <span id="import-status" class="import-status"></span>
            </div>

            <!-- フィルター -->
            <div class="filters">
                <select id="status-filter">
                    <option value="pending">未判定</option>
                    <option value="all">すべて</option>
                    <option value="include">Include</option>
                    <option value="exclude">Exclude</option>
                    <option value="maybe">Maybe</option>
                </select>
                <input type="search" id="search-input" placeholder="検索...">
            </div>

            <!-- 文献詳細 -->
            <article id="reference-detail" class="reference-card">
                <h3 id="ref-title" class="ref-title">タイトル</h3>
                <div class="ref-meta">
                    <span id="ref-authors"></span>
                    <span id="ref-year"></span>
                    <span id="ref-journal"></span>
                </div>
                <div id="ref-abstract" class="ref-abstract">抄録がここに表示されます</div>
                <div class="ref-links">
                    <a id="ref-doi" href="#" target="_blank" class="hidden">DOI</a>
                    <a id="ref-pmid" href="#" target="_blank" class="hidden">PubMed</a>
                </div>
            </article>

            <!-- 判定ボタン -->
            <div class="decision-buttons">
                <button id="btn-include" class="btn btn-include" title="Include (i)">
                    ✓ Include
                </button>
                <button id="btn-maybe" class="btn btn-maybe" title="Maybe (m)">
                    ? Maybe
                </button>
                <button id="btn-exclude" class="btn btn-exclude" title="Exclude (e)">
                    ✕ Exclude
                </button>
            </div>

            <!-- 除外理由 -->
            <div id="exclude-reason-group" class="form-group hidden">
                <label for="exclude-reason">除外理由</label>
                <select id="exclude-reason">
                    <option value="">選択してください</option>
                    <option value="not_relevant">関連性なし</option>
                    <option value="wrong_population">対象外の集団</option>
                    <option value="wrong_study_design">対象外の研究デザイン</option>
                    <option value="duplicate">重複</option>
                    <option value="other">その他</option>
                </select>
            </div>

            <!-- メモ -->
            <div class="form-group">
                <label for="note">メモ</label>
                <textarea id="note" rows="2" placeholder="メモを入力..."></textarea>
            </div>

            <!-- ナビゲーション -->
            <div class="navigation">
                <button id="btn-prev" class="btn btn-nav" title="前へ (←)">← 前へ</button>
                <span id="nav-position">1 / 100</span>
                <button id="btn-next" class="btn btn-nav" title="次へ (→)">次へ →</button>
            </div>
        </section>
    </div>

    <script src="sidepanel.js"></script>
</body>

</html>
