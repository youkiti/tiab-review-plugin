<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiAb Review - Full-text Screening</title>
    <link rel="stylesheet" href="fulltext.css">
</head>

<body>
    <div id="app">
        <!-- ヘッダー -->
        <header class="ft-header">
            <div class="ft-header-left">
                <button id="ft-close-btn" class="ft-close-btn" title="タブを閉じて一覧に戻る">← 閉じる</button>
                <h1 class="ft-title">Full-text Screening</h1>
                <button id="ft-criteria-btn" class="btn btn-secondary" title="レビュー基準（組入・除外基準）">📋 基準</button>
            </div>
            <div class="ft-header-right">
                <span id="ft-overall" class="ft-overall" title="候補プール全体の判定進捗">
                    <span id="ft-overall-text" class="ft-overall-text"></span>
                    <span class="ft-overall-bar"><span id="ft-overall-fill" class="ft-overall-fill"></span></span>
                </span>
                <span id="ft-progress" class="ft-progress"></span>
            </div>
        </header>

        <main class="ft-main">
            <!-- 左ペイン: PDFビュワー -->
            <section class="ft-pdf-pane" id="ft-pdf-pane">
                <!-- 書誌情報バー: PDF本文と照合して誤りPDFでないか確認できる -->
                <div id="ft-biblio" class="ft-biblio hidden">
                    <div id="ft-biblio-title" class="ft-biblio-title"></div>
                    <div id="ft-biblio-meta" class="ft-biblio-meta"></div>
                    <div id="ft-biblio-ids" class="ft-biblio-ids"></div>
                </div>
                <div id="ft-pdf-toolbar" class="ft-pdf-toolbar">
                    <span id="ft-pdf-url-label" class="ft-pdf-url-label"></span>
                    <!-- PDF未保存時に表示: ローカルPDFをアップロードする導線
                         （論文ページ埋め込み中でも手元のPDFを保存できる） -->
                    <button id="ft-upload-btn" class="btn btn-secondary hidden">⬆ PDFをアップロード</button>
                    <!-- リンクのみPDFをインライン表示できたが自動保存できなかった時の手動保存導線 -->
                    <button id="ft-save-pdf-btn" class="btn btn-secondary hidden">このPDFを保存</button>
                    <!-- PDF保存済み時のみ表示: 差し替え導線 -->
                    <button id="ft-replace-btn" class="btn btn-secondary hidden">別のPDFをアップロード</button>
                    <button id="ft-delete-btn" class="btn btn-secondary hidden">PDFを削除</button>
                    <!-- 登録行のスナップショット表示中のみ表示（fulltext.ts の
                         showSnapshotSaveButton/hideSnapshotSaveButton）。ラベルは新規追加の
                         文言のため wireSnapshotPrintButton() が t() 経由で設定する。
                         既存の ft-save-pdf-btn（リンクのみPDFの手動保存導線）とは別物。 -->
                    <button id="ft-snapshot-print-btn" class="btn btn-secondary hidden">💾 PDFとして保存</button>
                    <input type="file" id="ft-upload-input" accept="application/pdf,.pdf" class="hidden">
                </div>
                <div id="ft-pdf-viewer" class="ft-pdf-viewer">
                    <!-- PDF.js が全ページの canvas + テキスト/ハイライトレイヤーを描画する。
                         Drive保存済み(cached)PDFのバイト列が取得できた時のみ使用する。 -->
                    <div id="ft-pdf-canvas-container" class="ft-pdf-canvas-container hidden"></div>
                    <div id="ft-pdf-placeholder" class="ft-pdf-placeholder">
                        PDFが取得されていません
                    </div>
                    <!-- Drive保存済みPDFの表示用（blob: または Drive プレビュー埋め込み）
                         Chrome内蔵PDFビュワーを使うため sandbox は付けない -->
                    <iframe id="ft-pdf-frame" class="ft-pdf-frame hidden" title="フルテキストPDF"></iframe>
                    <!-- フルテキスト未発見時に論文ページを埋め込み表示 -->
                    <iframe id="ft-article-frame" class="ft-article-frame hidden"
                        referrerpolicy="no-referrer"
                        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
                    <!-- registration行の自己完結HTMLスナップショット表示専用（Issue #118 実装内容10）。
                         srcdoc で流し込む（fulltext.ts の showRegistrySnapshotFrame）。
                         allow-scripts は絶対に付けない（スナップショット内のスクリプトを一切実行
                         させないため。保存先はユーザーが編集し得るDriveファイルなので信頼できない
                         前提で扱う）。allow-same-origin は親から frame.contentWindow.print() を
                         呼ぶために必要（「PDFとして保存」ボタン）。allow-scripts と同時に付けると
                         sandboxが実質無効化されるが、scriptsを付けないため危険な組み合わせには
                         ならない。allow-modals は印刷ダイアログに必要。
                         allow-popups / allow-popups-to-escape-sandbox（PR #124 レビュー指摘3）:
                         buildRegistrySnapshotHtml() が埋め込む原簿URLの <a> は
                         target="_blank" rel="noopener noreferrer" を持つ。想定している機序は次の
                         とおり（HTML仕様上の一般則からの推論であり、この環境ではブラウザを
                         実際に操作して確認できていない。ブラウザ実装差の可能性もあるため、
                         挙動は実機で確認すること）:
                         target属性・allow-popups のどちらも無い状態では、クリックで
                         サンドボックスiframe自身がその場で遷移する。サンドボックス化された
                         閲覧コンテキストが「自分自身」を遷移させることは常に許可されており、
                         これは allow-top-navigation（トップレベルの閲覧コンテキストの遷移を
                         制御するフラグで別物）の有無とは無関係に起こる。この遷移でスナップショット
                         表示が消え、遷移先にはsandboxが再適用されallow-scriptsが無いため崩れて
                         表示され、ペインへ戻る手段が無くなる。
                         target="_blank" を付けても allow-popups が無い場合、HTML仕様の
                         「sandboxed auxiliary navigation browsing context flag」が立っているため
                         補助閲覧コンテキスト（新規タブ）の生成自体がブロックされる。iframe内遷移へ
                         フォールバックするのではなく、リンクをクリックしても何も起きない
                         （ブラウザがコンソールにエラーを出す想定）。そのため allow-popups が要る。
                         allow-popups だけだと開いた新規タブにもsandboxが継承され、allow-scriptsが
                         無いため遷移先が崩れる。そのため allow-popups-to-escape-sandbox を付けて
                         新規タブを非サンドボックスにする。この組み合わせが安全な理由: スナップショット
                         HTMLにスクリプトは
                         一切無い（allow-scriptsを付けていないため）ので window.open を
                         programmatic に呼ぶ経路は存在せず、ポップアップはユーザーの
                         アンカークリックのみから発生する。かつそのhrefは isSafeHttpUrl() を
                         通ったhttp/httpsのみ（buildRegistrySnapshotHtml側でガード済み）。
                         既存の ft-article-frame とは用途もsandbox設定も別物のため流用しない。 -->
                    <iframe id="ft-snapshot-frame" class="ft-snapshot-frame hidden" title="試験登録情報"
                        sandbox="allow-same-origin allow-modals allow-popups allow-popups-to-escape-sandbox"></iframe>
                    <!-- PDFドラッグ&ドロップ用オーバーレイ。
                         dragenter時に最前面へ出して iframe へのドロップを奪う。 -->
                    <div id="ft-drop-overlay" class="ft-drop-overlay hidden">
                        <div class="ft-drop-overlay-inner">PDFをここにドロップしてアップロード</div>
                    </div>
                </div>
            </section>

            <!-- 右ペイン: 決断 + アノテーション一覧 -->
            <aside class="ft-decision-pane" id="ft-decision-pane">
                <!-- 決断パネル -->
                <section class="ft-panel ft-decision-panel">
                    <h2 class="ft-panel-title">判定</h2>
                    <div class="ft-decision-buttons">
                        <button id="ft-btn-include" class="btn btn-include" data-decision="include" title="組み入れ (i)">組み入れ (i)</button>
                        <button id="ft-btn-exclude" class="btn btn-exclude" data-decision="exclude" title="除外 (e)">除外 (e)</button>
                        <button id="ft-btn-maybe" class="btn btn-maybe" data-decision="maybe" title="保留 (m)">保留 (m)</button>
                    </div>
                    <div id="ft-reason-area" class="ft-reason-area hidden">
                        <label class="ft-reason-label">除外理由 (PRISMA)</label>
                        <div class="ft-reason-priority-note">複数当てはまるときは<strong>上（番号が小さい方）</strong>を選ぶ ─ 理由が判定者間で割れると、あとで裁定が必要になります</div>
                        <!--
                            選択肢はプロジェクト設定（Config タブ fulltext_exclude_reasons）から
                            fulltext.ts の renderReasonOptions() が実行時に描画する。
                            未設定なら既定のPICO7区分（src/lib/exclude-reasons.ts）。
                            ここに固定の <option> を書かないこと（設定と二重定義になる）。
                        -->
                        <select id="ft-reason-select" class="ft-reason-select" size="7"></select>
                        <div class="ft-reason-hint">クリックまたは数字キーで確定して次へ ／ ↑↓ で移動・Enter で確定</div>
                        <textarea id="ft-reason-note" class="ft-reason-note" placeholder="補足メモ（任意・Enterで保存して次へ／Shift+Enterで改行）" rows="3"></textarea>
                    </div>
                    <button id="ft-save-btn" class="btn btn-primary ft-save-btn hidden">保存</button>
                </section>

                <!-- 文脈参照: 抄録・自分のTiAb判定・他レビュアーの判定（PDF取り違え確認・文脈想起・不一致の見直し用）
                     見出しは Blind 状態で変わるため fulltext.ts の renderContextPanel() が実行時に書き換える -->
                <section class="ft-panel ft-context-panel">
                    <details id="ft-context-details">
                        <summary id="ft-context-summary" class="ft-context-summary">抄録・自分のTiAb判定</summary>
                        <div id="ft-context-body" class="ft-context-body"></div>
                    </details>
                </section>

                <!-- アノテーション一覧 -->
                <section class="ft-panel ft-annotations-panel">
                    <h2 class="ft-panel-title">
                        ハイライト
                        <label class="ft-highlight-toggle" title="PDF上のハイライトのみ切り替えます（根拠一覧は残ります）">
                            <input type="checkbox" id="ft-highlight-checkbox" checked>
                            <span>PDF上に表示</span>
                        </label>
                    </h2>
                    <div id="ft-annotations-list" class="ft-annotations-list">
                        <!-- アノテーションカードがここに入る -->
                    </div>
                </section>

                <!-- ナビゲーション -->
                <div class="ft-nav">
                    <button id="ft-prev-btn" class="btn btn-secondary">← 前</button>
                    <button id="ft-next-undecided-btn" class="btn btn-secondary"
                        title="次の未判定候補へジャンプ (u)">未判定へ (u)</button>
                    <button id="ft-next-btn" class="btn btn-secondary">次 →</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- レビュー基準（組入・除外基準）モーダル。閲覧専用（編集はサイドパネルに一本化）。
         サイドパネルの #modal-backdrop 構造を踏襲しつつ ID は ft- プレフィックスで独立させる。 -->
    <div id="ft-criteria-backdrop" class="ft-criteria-backdrop hidden">
        <div class="ft-criteria-content">
            <div class="ft-criteria-header">
                <h3 id="ft-criteria-title" class="ft-criteria-title">レビュー基準（組入・除外基準）</h3>
                <button id="ft-criteria-close-btn" class="btn-icon" title="閉じる (c / Esc)">✕</button>
            </div>
            <div id="ft-criteria-body" class="ft-criteria-body"></div>
            <div class="ft-criteria-footer">
                <button id="ft-criteria-footer-close-btn" class="btn btn-outline btn-small">閉じる</button>
            </div>
        </div>
    </div>

    <script src="fulltext.js"></script>
</body>

</html>
