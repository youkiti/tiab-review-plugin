<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Picker</title>
  <link rel="stylesheet" href="webapp.css">
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px; font-family: system-ui, sans-serif; }
    .card { border: 1px solid #dadce0; border-radius: 12px; padding: 24px; background: #fff; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    button, a.button { border: 0; border-radius: 8px; padding: 10px 16px; background: #1a73e8; color: #fff; text-decoration: none; cursor: pointer; font-weight: 600; }
    a.secondary { background: #f1f3f4; color: #202124; }
    #status { margin-top: 16px; white-space: pre-wrap; }
    .hint { color: #5f6368; line-height: 1.6; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
  <main class="card">
    <h1 id="title">Google Picker</h1>
    <p id="intro" class="hint"></p>
    <p id="shareHint" class="hint"></p>
    <div class="actions">
      <button id="startBtn" type="button"></button>
      <a id="allSheetsLink" class="button secondary" href="picker.html"></a>
    </div>
    <div id="status" role="status"></div>
  </main>
  <script src="picker.js"></script>
</body>
</html>
